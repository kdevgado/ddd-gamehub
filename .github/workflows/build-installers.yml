name: Build installable apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the app
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run desktop:installer

      - name: Attest Windows installer provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/windows/*.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DDD-Game-Hub-Windows
          path: release/windows/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the app
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Required Android signing secret is missing: $variable" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/ddd-game-hub-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          key_alias="$(keytool -list -v -storetype PKCS12 -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -1)"
          if [ -z "$key_alias" ]; then
            echo "No private-key alias was found in the Android release keystore" >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: npm run android:apk

      - name: Verify APK signature and checksum
        env:
          EXPECTED_CERT_SHA256: B9213DE90134A8F90970E63F575A070C9D6F32D694141C03BA3884EAFE620F83
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found in the Android SDK" >&2
            exit 1
          fi
          verification="$($apksigner_path verify --verbose --print-certs release/android/DDD-Game-Hub-Android.apk)"
          printf '%s\n' "$verification"
          if printf '%s' "$verification" | grep -q 'CN=Android Debug'; then
            echo "Refusing to publish an APK signed with the Android debug certificate" >&2
            exit 1
          fi
          if ! printf '%s' "$verification" | tr '[:lower:]' '[:upper:]' | grep -q "$EXPECTED_CERT_SHA256"; then
            echo "APK certificate does not match the pinned DDD Game Hub release certificate" >&2
            exit 1
          fi
          cd release/android
          sha256sum --check DDD-Game-Hub-Android.apk.sha256

      - name: Attest Android APK provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/android/DDD-Game-Hub-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DDD-Game-Hub-Android
          path: |
            release/android/*.apk
            release/android/*.sha256
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "DDD Game Hub $GITHUB_REF_NAME"
